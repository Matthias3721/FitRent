services:
  postgres:
    image: postgres:16
    container_name: fitrent-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fitrent-pgdata:/var/lib/postgresql/data

volumes:
  fitrent-pgdata: